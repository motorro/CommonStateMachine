name: Skills

on:
  release:
    types: [published]

jobs:
  publish:
    name: Build and upload skills
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/remotes/origin/master
      - name: Build skills
        run: ./skills/build_skills.sh artifacts
      - name: Upload skills to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
