name: Skills

on:
  release:
    types: [published]

jobs:
  publish:
    name: Build and upload skills
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/remotes/origin/master
      - name: Build skills
        run: ./skills-src/build_skills.sh
      - name: Archive skills
        run: |
          mkdir -p artifacts
          cd skills
          find . -path '*/.*' -prune -o -name "SKILL.md" -print | while read -r skill_file; do
              skill_dir=$(dirname "$skill_file")
              rel_dir="${skill_dir#./}"
              dir_name=$(basename "$skill_dir")
              parent_dir=$(basename "$(dirname "$skill_dir")")
              skill_name="skill-${parent_dir}-${dir_name}"

              zip_name="${skill_name}.zip"
              echo "Zipping $rel_dir to $zip_name"
              zip -q -r "../artifacts/$zip_name" "$rel_dir" -x "*.DS_Store"
          done
      - name: Upload skills to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
